name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not left to whatever the runner image happens to ship: the
      # Edge Function tests read the shipped TypeScript and strip its types with
      # node:module's stripTypeScriptTypes, which needs Node >= 22.13. On an
      # older Node those tests would ERROR rather than quietly skip, but the
      # runner's default has moved before and the rest of the suite should not
      # be at the mercy of it either.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the front end (app.js, sw.js, build.mjs)
        run: |
          node --check app.js
          if [ -f sw.js ]; then node --check sw.js; fi
          if [ -f build.mjs ]; then node --check build.mjs; fi

      - name: Unit-test the price/grouping helpers
        run: node --test

      - name: Validate JSON config
        run: |
          for f in vercel.json manifest.webmanifest; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok: $f"
          done

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the Supabase Edge Functions
        run: |
          status=0
          for f in supabase/functions/*/index.ts; do
            echo "::group::deno check $f"
            deno check "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
