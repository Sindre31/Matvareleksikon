  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-900); text-decoration: underline; }
    @keyframes scanline { 0% { top: 4%; } 50% { top: 92%; } 100% { top: 4%; } }
    @keyframes mlbar { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }

    /* Interactive row/card hover — the design system expresses these as
       inline `style-hover` on the dc-runtime; here they are real CSS rules. */
    .row-hover { transition: background 0.12s ease; }
    .row-hover:hover { background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
    .card-hover { transition: background 0.12s ease; }
    .card-hover:hover { background: color-mix(in srgb, var(--color-accent) 6%, transparent); }

    /* Small screens: let the top bar wrap instead of overflowing. */
    @media (max-width: 640px) {
      .nav { flex-wrap: wrap; row-gap: 8px; }
      .nav > span[style*="tnum"] { order: 3; flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- app.js also registers the offline service worker. Keeping that inline
       would force 'unsafe-inline' (or a hash to re-generate on every edit)
       into the Content-Security-Policy in vercel.json. -->
  <script src="app.js"></script>
</body>
