<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisboka — Matvareleksikon med pristrender</title>
  <meta name="description" content="Matvareleksikon med ekte matvarepriser fra norske dagligvarekjeder — hentet fra tilbudsaviser og skannede kvitteringer, og hvor prisen er på vei.">
  <meta name="theme-color" content="#5980a6">
  <!-- Four icon links, not one, because four different consumers read them.
       Google Search takes the favicon for the result row from rel="icon" /
       rel="apple-touch-icon" and needs Googlebot-Image to be able to fetch the
       file it points at; an SVG is the one format it has no guarantee of
       rasterising, and /favicon.ico — the path every crawler falls back to when
       the markup gives it nothing it can use — was a 404 here, which is what
       left the grey globe next to prisboka.no in the results.
       favicon.ico carries 16-256 px in one file, so the tab, the bookmark bar
       and the search result each pick a size instead of downscaling a guess;
       browsers that understand SVG take the sharper favicon.svg on the next
       line, since the last icon link a browser can use wins. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Correct for "/", and deliberately kept for what else this file serves.
       index.html is three things at once: the shell build.mjs templates every
       page from, the front page, and — through the vercel.json rewrites — what
       /liste, /vare/* and every unprerendered /gruppe/* fall back to. So this
       one line answers for tens of thousands of URLs, and the question is which
       answer is least wrong for them.
       It used to be badly wrong, because the pages that needed a canonical of
       their own did not have a file of their own: /om and /skann were in the
       sitemap and served from here, so we asked Google to index them and told it
       they were duplicates of the front page in the same breath, and the ~1 500
       single-store groups the category pages link to were doing the same. All of
       those are prerendered as their own file now, and setCanonical() in
       build.mjs gives each an explicit canonical that replaces this one.
       What is left behind the rewrites is /liste (a private basket), /admin, and
       the /vare/* pages — 14 000-21 000 of those are reachable, two or three off
       every product page. They are all served these exact bytes, which since the
       front page became prerendered means they are served the FRONT PAGE'S
       markup. Pointing them at "/" is therefore not a lie, it is a description:
       consolidating an unbounded set of identical pages onto the one real page
       among them is the outcome we want, and dropping the line instead left
       Google a 20 000-page duplicate cluster to sort out — the same crawl-budget
       waste the rest of this change exists to stop.
       Keep it. A page that needs its own canonical needs its own file. -->
  <link rel="canonical" href="https://prisboka.no/">

  <!-- Installable PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prisboka">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Prisboka">
  <meta property="og:title" content="Prisboka — Matvareleksikon med pristrender">
  <meta property="og:description" content="Prisene kommer fra kjedenes tilbudsaviser og fra kvitteringer folk skanner. Søk opp en vare, se hva den koster i hver butikk — og hvor prisen er på vei.">
  <meta property="og:url" content="https://prisboka.no/">
  <meta property="og:image" content="https://prisboka.no/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Prisboka — Matvareleksikon med pristrender">
  <meta name="twitter:description" content="Matvarepriser fra tilbudsaviser og skannede kvitteringer — og hvor prisen er på vei.">
  <meta name="twitter:image" content="https://prisboka.no/og.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://prisboka.no/#website",
        "url": "https://prisboka.no/",
        "name": "Prisboka",
        "alternateName": "Matvareleksikon",
        "inLanguage": "nb-NO",
        "description": "Matvareleksikon med ekte matvarepriser fra norske dagligvarekjeder — hentet fra tilbudsaviser og skannede kvitteringer, og hvor prisen er på vei."
      },
      {
        "@type": "Organization",
        "@id": "https://prisboka.no/#org",
        "name": "Prisboka",
        "url": "https://prisboka.no/",
        "logo": "https://prisboka.no/icon-512.png",
        "email": "support@prisboka.no"
      }
    ]
  }
  </script>

  <!-- Warm up the three cross-origin connections the first paint waits on, so
       the DNS + TLS handshakes overlap the HTML parse instead of following it.
       Supabase matters most: app.js starts fetching the catalogue the moment it
       parses, and a cold handshake is a few hundred ms of that wait on mobile.
       The font stylesheet is *also* @import-ed from styles.css (the design
       system owns that file), but an @import can only be discovered after
       styles.css has downloaded and parsed — linking it here starts the very
       same request a full round trip earlier, and the browser coalesces the
       two into one fetch. -->
  <link rel="preconnect" href="https://jiaxeedguivvhixychcg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap">

  <!-- Root-relative, not relative. Every screen now has its own path, so on
       /gruppe/helmelk a bare "styles.css" resolves to /gruppe/styles.css —
       which is not a file, falls through to the SPA rewrite, and returns the
       HTML shell as a stylesheet. Same for app.js. Keep the leading slash on
       every asset in this file. -->
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); text-wrap: pretty; }
    a { color: var(--color-accent-700); text-decoration: none; }
    a:hover { color: var(--color-accent-900); text-decoration: underline; }
    @keyframes scanline { 0% { top: 4%; } 50% { top: 92%; } 100% { top: 4%; } }
    @keyframes mlbar { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }

    /* Interactive row/card hover — the design system expresses these as
       inline `style-hover` on the dc-runtime; here they are real CSS rules. */
    .row-hover { transition: background 0.12s ease; }
    .row-hover:hover { background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
    .card-hover { transition: background 0.12s ease; }
    .card-hover:hover { background: color-mix(in srgb, var(--color-accent) 6%, transparent); }

    /* The shopping-list link carries both a label and a cart glyph; the wide
       bar has room for the words, so the glyph stays out of the layout. */
    .nav-cart-icon { display: none; }
    .nav-cart-count { font-size: 12px; font-feature-settings: 'tnum' 1; }

    /* "Selges hos": store, offer tag, price, and the report button. Four
       columns fit a desktop and crush a phone — the product name is the one
       that gives, and it is the one thing on the row you have to be able to
       read. Names run to 50 characters ("Sjokolade Mørk 70% Karamell/Mandel/
       Havsalt 100g Ja"), so below 560 px the name takes the full width and the
       other three sit under it on a line of their own. */
    .store-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; }
    .store-row > :first-child { min-width: 0; }   /* below its longest word, so the name wraps instead of widening the row */
    @media (max-width: 560px) {
      .store-row {
        grid-template-columns: 1fr auto auto;
        grid-template-areas: "name name name" "tag price report";
        row-gap: 10px;
      }
      .store-row > :nth-child(1) { grid-area: name; }
      .store-row > :nth-child(2) { grid-area: tag; justify-self: start; }
      .store-row > :nth-child(3) { grid-area: price; justify-self: end; }
      .store-row > :nth-child(4) { grid-area: report; justify-self: end; }
    }

    /* The floating "Gi tilbakemelding" button. Bottom-right, over everything
       on the page but under the dialogs (z-index 50). env(safe-area-inset-*)
       keeps it clear of the home indicator on an iPhone and of the browser
       chrome that overlaps the bottom of the viewport. */
    .feedback-fab {
      position: fixed; z-index: 40;
      right: calc(16px + env(safe-area-inset-right, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      min-height: 44px;                       /* a thumb target, not a mouse one */
      box-shadow: 0 2px 10px color-mix(in srgb, var(--color-text) 28%, transparent);
      font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    /* Below 560 px the words would cover a third of the screen, so the glyph
       carries it and the label lives on in the aria-label + title. */
    @media (max-width: 560px) {
      .feedback-fab { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; padding: 0; }
      .feedback-fab span[aria-hidden] { font-size: 19px; }
      .feedback-fab-text { display: none; }
    }
    /* The footer is the one thing the button can cover for good — everything
       else scrolls past it — so the last row needs a button's worth of room
       under it.
       This has to travel as a custom property rather than a rule of its own:
       renderFooter() sets the footer's padding as an inline `style` attribute,
       and an inline declaration beats any stylesheet selector no matter how
       specific, so `footer > div { padding-bottom: … }` here never applied.
       The inline value reads the variable instead, and the media query below
       is what changes it. */
    :root { --fab-gutter: 0px; }
    @media (max-width: 560px) {
      :root { --fab-gutter: 44px; }   /* 48px button + 12px inset, less the 48px the footer already has, rounded up */
    }

    /* Small screens: let the top bar wrap instead of overflowing. */
    @media (max-width: 640px) {
      .nav { flex-wrap: wrap; row-gap: 10px; column-gap: clamp(8px, 2.6vw, 10px); }
      /* Thumb-sized rather than desktop-sized, now that the row holds three
         items and a glyph instead of six. The row has to stay one line down to
         the narrowest phones in use, so the type scales with the viewport
         instead of picking one size that either wraps at 320 px or wastes the
         space at 430: 21/15 px from ~390 px up, easing to 17/13 at 320. */
      .nav-brand { font-size: clamp(17px, 5.4vw, 21px); }
      .nav a { font-size: clamp(13px, 3.85vw, 15px); }
      /* The freshness stamp is its own row, so a rule under the links reads as
         the bar's own edge and separates the menu from the data it describes. */
      .nav > span[style*="tnum"] {
        order: 3; flex-basis: 100%;
        border-top: 1px solid var(--color-divider);
        padding-top: 9px;
      }
      /* One line for Prisboka · Leksikon · Bidra med priser · cart: the list
         label collapses to the glyph and moves to the end of the row, and what
         doesn't fit drops out — "Om" lives in the footer of every screen, and
         "Skann kvittering" is where "Bidra med priser" already leads. */
      .nav-wide-only { display: none; }
      .nav-cart { order: 1; }
      .nav-cart-text { display: none; }
      .nav-cart-icon { display: inline-flex; align-items: center; gap: 3px; }
      .nav-cart-icon svg { width: 22px; height: 22px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- app.js also registers the offline service worker. Keeping that inline
       would force 'unsafe-inline' (or a hash to re-generate on every edit)
       into the Content-Security-Policy in vercel.json. -->
  <script src="/app.js"></script>
  <!-- Vercel Web Analytics. The script and its beacon both live under
       /_vercel/insights/ on our own origin (Vercel's edge injects those routes
       once Analytics is enabled for the project), so the existing
       script-src 'self' / connect-src 'self' CSP already covers them.
       data-disable-auto-track because app.js reports the views itself: it
       attaches the `route` pattern (so thousands of products group under
       /gruppe/[gruppe] instead of filling the dashboard one by one), which the
       tracker knows nothing about, and it catches /liste#d=… which moves
       without changing the pathname the tracker watches. The queue
       shim Vercel's snippet puts inline lives in app.js for the same reason
       the service worker registration does — to keep script-src at 'self'. -->
  <script defer src="/_vercel/insights/script.js" data-disable-auto-track="1"></script>
  <!-- Google Analytics 4 (G-D75JFRDSGK). Only the tag loader lives here; the
       `gtag('config', …)` call and the page views are in app.js, so the CSP
       keeps script-src at 'self' plus this one host — no 'unsafe-inline'.
       app.js reports the views for the same reason it does for Vercel: GA's
       own page_view fires on load only, so it is switched off with
       send_page_view:false and every screen is reported by hand. `async` rather than `defer` is Google's own form; the
       dataLayer queue in app.js means order between the two does not matter. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D75JFRDSGK"></script>
</body>
</html>
